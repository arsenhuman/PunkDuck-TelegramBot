name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bot image
        run: docker build -t punkduck-bot:ci ./bot

      - name: Validate docker-compose config
        run: |
          cp .env.example .env
          docker compose config >/dev/null
